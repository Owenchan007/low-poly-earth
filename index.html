<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Poly Earth — 手势交互新媒体艺术</title>

  <!-- Typography: Space Grotesk + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Three.js Canvas ===== -->
  <canvas id="globe-canvas"></canvas>

  <!-- ===== Cosmic Background Overlay ===== -->
  <div class="cosmic-bg"></div>

  <!-- ===== Title / Branding ===== -->
  <header class="title-bar">
    <div class="title-text">
      <h1>Low Poly Earth</h1>
      <p class="subtitle">手势交互 · 新媒体艺术</p>
    </div>
  </header>

  <!-- ===== Gesture Status Panel ===== -->
  <aside class="glass-panel gesture-panel">
    <div class="panel-header">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/>
        <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v6"/>
        <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/>
        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L2.3 17a2 2 0 0 1 .3-2.7 2 2 0 0 1 2.7.1L6 15"/>
      </svg>
      <span>手势状态</span>
    </div>

    <div class="status-grid">
      <div class="status-item">
        <span class="status-label">检测状态</span>
        <span class="status-value" id="detection-status">
          <span class="status-dot offline"></span>
          等待启动
        </span>
      </div>
      <div class="status-item">
        <span class="status-label">当前手势</span>
        <span class="status-value" id="gesture-type">—</span>
      </div>
      <div class="status-item">
        <span class="status-label">缩放倍率</span>
        <span class="status-value" id="zoom-level">1.0x</span>
      </div>
      <div class="status-item">
        <span class="status-label">旋转角度</span>
        <span class="status-value" id="rotation-angle">0°</span>
      </div>
    </div>

  </aside>

  <!-- ===== Webcam Preview ===== -->
  <div class="glass-panel webcam-container">
    <div class="webcam-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/>
        <rect x="2" y="6" width="14" height="12" rx="2"/>
      </svg>
      <span>摄像头</span>
      <span class="webcam-badge" id="cam-status">OFF</span>
    </div>
    <div class="webcam-viewport">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="hand-overlay"></canvas>
    </div>
  </div>

  <!-- ===== Start Button ===== -->
  <div class="start-overlay" id="start-overlay">
    <div class="glass-panel start-card">
      <div class="start-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/>
          <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v6"/>
          <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/>
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L2.3 17a2 2 0 0 1 .3-2.7 2 2 0 0 1 2.7.1L6 15"/>
        </svg>
      </div>
      <h2>启动手势交互</h2>
      <p>需要摄像头权限来识别手势</p>
      <div class="gesture-hints">
        <div class="hint-item">
          <span class="hint-icon">🖐️↔️</span>
          <span>手掌靠近/远离 — 缩放地球</span>
        </div>
        <div class="hint-item">
          <span class="hint-icon">🖐️</span>
          <span>张开手掌移动 — 旋转地球</span>
        </div>
      </div>
      <button class="start-btn" id="start-btn">
        <span>启动摄像头</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <p class="start-note">点击后浏览器会请求摄像头权限</p>
    </div>
  </div>

  <!-- ===== Instruction Tooltip ===== -->
  <div class="glass-panel instruction-tip" id="instruction-tip">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 16v-4"/>
      <path d="M12 8h.01"/>
    </svg>
    <span>也可以用鼠标拖拽旋转 · 滚轮缩放</span>
  </div>

  <!-- ===== Scripts ===== -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js" crossorigin="anonymous"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
